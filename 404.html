<script>
(function () {

    location.replace(target);

})();

/* 失联示波器：一段信号每六秒衰减回直线 */
(function () {
  "use strict";
  var cv = document.getElementById("scope-cv");
  if (!cv || !cv.getContext) return;
  var ctx = cv.getContext("2d");
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var dpr = Math.min(2, window.devicePixelRatio || 1);

  function size() {
    var r = cv.getBoundingClientRect();
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
  }

  function draw(t) {
    var w = cv.width, h = cv.height, mid = h / 2;
    ctx.clearRect(0, 0, w, h);
    var cycle = (t % 6000) / 6000;
    var env = Math.exp(-cycle * 5);
    /* 起爆瞬间给一道竖向扫描亮线 */
    if (env > 0.92 && !reduced) {
      var sx = (cycle) * w * 14 % w;
      ctx.fillStyle = "rgba(255,180,84,.10)";
      ctx.fillRect(sx - 2 * dpr, 0, 4 * dpr, h);
    }
    ctx.strokeStyle = "#ffb454";
    ctx.lineWidth = 1.5 * dpr;
    ctx.shadowColor = "rgba(255,180,84,.75)";
    ctx.shadowBlur = 7 * dpr;
    ctx.beginPath();
    for (var x = 0; x <= w; x += 3 * dpr) {
      var n = Math.sin(x * 0.030 / dpr + t * 0.006) *
              Math.sin(x * 0.009 / dpr - t * 0.0033);
      var drift = Math.sin(x * 0.0012 + t * 0.0011);
      var y = mid - (n * h * 0.34 + drift * h * 0.05) * env;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  size();
  if (reduced) { draw(900); return; }
  window.addEventListener("resize", function () { size(); });
  (function frame(ts) {
    draw(ts || 0);
    requestAnimationFrame(frame);
  })(0);
})();
</script>
