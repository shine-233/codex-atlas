name: e2e

# 手动触发或每周四跑一次全量回归（55+ 断言）。
# 依赖 Playwright Chromium；套件自起 http.server，不需要部署环境。
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 4"   # 每周四 04:00 UTC

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: 全量回归
        run: python tools/e2e/regression.py

      - name: 失败即红
        if: failure()
        run: echo "回归有失败项——看上方 FAIL 清单定位"
